; PlatformIO Project Configuration File
;
; MAX2 V1.0.1 RC branch: apply the tested MAX2 awake-state compatibility
; patch before compiling, keeping the runtime change isolated to this branch.

[platformio]
default_envs = esp32-c3-devkitm-1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@^2.4.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
extra_scripts = pre:scripts/max2_v101_patch.py

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
board_build.partitions = default.csv

[env:esp32dev]
board = esp32dev
board_build.partitions = default.csv
