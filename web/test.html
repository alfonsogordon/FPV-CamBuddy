<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeCLinker OSD Simulator — FPSteVe Edition</title><link rel="stylesheet" href="fps-theme.css"><style>
*{box-sizing:border-box}body{margin:0;background:#090d14;color:#e8eef8;font:15px system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}a{color:#6db6ff}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:20px}.card{background:#111823;border:1px solid #263447;border-radius:14px;padding:18px}.screen{aspect-ratio:16/9;background:radial-gradient(circle at 55% 45%,#34475c,#111923 55%,#05080d);border:2px solid #34465d;border-radius:10px;position:relative;overflow:hidden;box-shadow:inset 0 0 80px #000}.screen:before{content:'SIMULATED FPV FEED';position:absolute;top:12px;left:12px;font:11px monospace;color:#8392a5}.osd{position:absolute;font:700 20px monospace;color:white;text-shadow:2px 2px 2px #000,-1px -1px 2px #000;white-space:pre}.craft{bottom:13%;left:50%;transform:translateX(-50%)}.pilot{top:11%;left:50%;transform:translateX(-50%)}.m1{top:12%;right:4%}.m2{top:20%;right:4%}.m3{bottom:20%;left:4%}.m4{bottom:12%;left:4%}.tag{position:absolute;opacity:.55;font:10px monospace}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select{background:#0a1019;color:#fff;border:1px solid #34465d;border-radius:7px;padding:8px}button{background:#1a2635;color:#eaf3ff;border:1px solid #3b536f;border-radius:8px;padding:9px 13px;cursor:pointer}button.on{background:#315d89}.status{font-family:monospace;color:#9bb1ca}.good{color:#77d59b}.warn{color:#ffcf6b}.wide{grid-column:1/-1}.summary{line-height:1.7;padding:10px 12px;background:#0a1019;border-radius:8px;margin-bottom:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><h1>OSD Simulator</h1><div class="status">FreeCLinker · FPSteVe Edition · configuration-aware browser preview</div></div><div><a href="config.html">← Configurator</a> · <a href="index.html">Home</a></div></div>
<div class="grid"><section class="card"><div class="screen"><div id="pilot" class="osd pilot"></div><div id="craft" class="osd craft"></div><div id="m1" class="osd m1"></div><div id="m2" class="osd m2"></div><div id="m3" class="osd m3"></div><div id="m4" class="osd m4"></div></div><div class="row"><button id="arm">ARM</button><button id="rec">Camera REC</button><button id="auxLow">AUX LOW</button><button id="auxMid">AUX MID</button><button id="auxHigh">AUX HIGH</button><button id="power">Power Cycle</button></div><div id="state" class="status"></div></section>
<section class="card"><h2>Loaded C3 configuration</h2><div id="cfgSummary" class="summary status"></div><div class="row"><button id="reload">Reload saved C3 config</button><a href="config.html"><button>Connect / configure C3</button></a></div><h2>Test conditions</h2><div class="controls"><label class="field">Battery %<input id="battery" type="number" min="0" max="100" value="69"></label><label class="field">Recording time left (min)<input id="time" type="number" min="0" value="45"></label><label class="field">Recording elapsed<input id="elapsed" value="00:12"></label><label class="field">SD free space<input id="capacity" value="42G"></label><label class="field">Resolution<input id="resolution" value="4K"></label><label class="field">FPS<input id="fps" value="60"></label><label class="field">Stabilization<input id="eis" value="EIS"></label><label><input id="hot" type="checkbox"> Camera hot</label><label><input id="media" type="checkbox" checked> Media ready</label><label><input id="hasBattery" type="checkbox" checked> Battery telemetry known</label><label><input id="hasTime" type="checkbox" checked> Time-left telemetry known</label><label><input id="hasTemp" type="checkbox" checked> Temperature status known</label></div><p class="status">This page previews the last configuration read from the C3 by the Configurator. Test-condition values are simulated; it does not send MSP or BLE.</p></section></div></div>
<script>
const $=id=>document.getElementById(id);const defaults={camera_type:'GoPro',aux_channel:'disabled',aux_mode:'0x0A',osd1:'CAM:{bat}',osd2:'{rec}{recdur}',osd3:'{mode} {res}/{fps} {eis}',osd4:'{rleft} {rcap}',bf45_compat:'true',pilot_en:'false',pilot_tpl:'',craft_en:'true',craft_tpl:'{state} {batt} {rectf}',fpv_state_mode:'true',fpv_error:'true',fpv_err_text:'{state} {batt} {rectf}',fpv_ready:'true',fpv_ready_text:'{state} {batt} {rectf}',fpv_record:'true',fpv_record_text:'{state}',fpv_flash:'true',fpv_prearm:'false',fpv_prearm_text:'',fpv_prearm_show:'1000',fpv_prearm_int:'3000',fpv_low_batt:'true',fpv_low_pct:'10',fpv_low_rdyflash:'true',fpv_low_rectext:'true',fpv_low_text:'BATT LOW',fpv_rect_warn:'true',fpv_rect_min:'5',fpv_rect_ready:'true',fpv_rect_record:'true',fpv_rect_text:'REC LOW',fpv_hot_warn:'true',fpv_hot_ready:'true',fpv_hot_record:'true',fpv_hot_text:'CAM HOT'};
let cfg={},armed=false,recording=false,armedOnce=false,aux='LOW',boot=performance.now();
function bool(k,d=false){return (cfg[k]??String(d))==='true'}function num(k,d=0){let n=parseInt(cfg[k]);return Number.isFinite(n)?n:d}function clean(s){return String(s??'').replace(/\s+/g,' ').trim()}function cameraName(){let v=cfg.camera_type??'GoPro';return ({'0':'DJI Action','1':'GoPro','2':'Caddx Orca','3':'Sony Alpha','4':'Blackmagic','5':'Insta360'})[v]||v}
function loadCfg(){try{cfg={...defaults,...JSON.parse(localStorage.getItem('freeclinkerC3Config')||'{}')}}catch{cfg={...defaults}};showSummary()}
function showSummary(){let saved=localStorage.getItem('freeclinkerC3Config');$('cfgSummary').innerHTML=`<span class="${saved?'good':'warn'}">${saved?'Using last config read from C3':'No C3 config cached yet — using preview defaults'}</span><br>Camera: ${cameraName()}<br>Betaflight: ${bool('bf45_compat')?'4.5 compatibility (Pilot/Craft Name)':'current (Custom Message 1–4)'}<br>AUX: ${cfg.aux_channel||'disabled'} · high mode ${modeName(cfg.aux_mode)}<br>Custom Message: ${cfg.fpv_prearm_text?cfg.fpv_prearm_text:'(none)'}`}
function modeName(v){let n=parseInt(v);return ({0:'Slow Motion',1:'Video',2:'Timelapse',5:'Photo',10:'Hyperlapse'})[n]||v||'Video'}
function tokens(state){let hb=$('hasBattery').checked,ht=$('hasTime').checked;return{state,bat:hb?$('battery').value+'%':'',batn:hb?$('battery').value:'',batt:hb?'B:'+$('battery').value:'',rect:ht?$('time').value+'m':'',rectf:ht?'T:'+$('time').value+'m':'',rec:recording?'REC ':'',recdur:recording?$('elapsed').value:'',mode:aux==='HIGH'?modeName(cfg.aux_mode):'Video',res:$('resolution').value,fps:$('fps').value,eis:$('eis').value,rleft:ht?$('time').value+'m':'',rcap:$('capacity').value}}
function expand(t,state){let x=String(t||''),tk=tokens(state);for(const[k,v]of Object.entries(tk))x=x.replaceAll('{'+k+'}',v);return clean(x)}
function warnings(){let w=[];if(bool('fpv_low_batt',true)&&$('hasBattery').checked&&+$('battery').value<=num('fpv_low_pct',10))w.push(cfg.fpv_low_text||'BATT LOW');if(bool('fpv_rect_warn',true)&&$('hasTime').checked&&+$('time').value<=num('fpv_rect_min',5))w.push(cfg.fpv_rect_text||'REC LOW');if(bool('fpv_hot_warn',true)&&$('hasTemp').checked&&$('hot').checked)w.push(cfg.fpv_hot_text||'CAM HOT');return w.map(x=>clean(x).slice(0,16))}
function baseState(){if(!$('media').checked)return'ERR';if(recording)return'REC';return'RDY'}
function craftOutput(now){let st=baseState(),template=st==='ERR'?cfg.fpv_err_text:st==='REC'?cfg.fpv_record_text:cfg.fpv_ready_text;let base=expand(template,st).slice(0,16),w=warnings(),alt=Math.floor(now/500)%2===1;if(w.length&&alt) return w[Math.floor(now/1000)%w.length];if(st==='REC'&&bool('fpv_flash',true)&&alt)return'                ';let msg=clean(cfg.fpv_prearm_text).slice(0,16),onlyFirst=bool('fpv_prearm',false),eligible=msg&&st==='RDY'&&!recording&&w.length===0&&(!onlyFirst||!armedOnce);if(eligible){let show=Math.max(100,Math.min(2500,num('fpv_prearm_show',1000))),interval=Math.max(show,num('fpv_prearm_int',3000));if((now-boot)%interval<show)return msg}return base}
function render(){let now=performance.now(),st=baseState(),bf45=bool('bf45_compat',true);if(bf45){$('m1').textContent=$('m2').textContent=$('m3').textContent=$('m4').textContent='';$('pilot').textContent=bool('pilot_en')?expand(cfg.pilot_tpl,st).slice(0,31):'';$('craft').textContent=bool('craft_en',true)?(bool('fpv_state_mode',true)?craftOutput(now):expand(cfg.craft_tpl,st).slice(0,31)):''}else{$('pilot').textContent=$('craft').textContent='';['osd1','osd2','osd3','osd4'].forEach((k,i)=>$("m"+(i+1)).textContent=expand(cfg[k],st).slice(0,31))}$('state').textContent=`ARM: ${armed?'ON':'OFF'} | Camera: ${recording?'REC':'IDLE'} | AUX: ${aux} (${aux==='HIGH'?modeName(cfg.aux_mode):'Video'}) | Armed since boot: ${armedOnce?'YES':'NO'}`;$('arm').textContent=armed?'DISARM':'ARM';$('arm').classList.toggle('on',armed);$('rec').classList.toggle('on',recording);requestAnimationFrame(render)}
$('arm').onclick=()=>{armed=!armed;if(armed){armedOnce=true;recording=true}else recording=false};$('rec').onclick=()=>recording=!recording;['Low','Mid','High'].forEach(x=>$('aux'+x).onclick=()=>aux=x.toUpperCase());$('power').onclick=()=>{armed=false;recording=false;armedOnce=false;aux='LOW';boot=performance.now()};$('reload').onclick=loadCfg;loadCfg();render();
</script></body></html>
