name: Build Custom Message Test

on:
  push:
    branches: [fps-custom-message]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fps-custom-message
      - name: Apply Custom Message changes
        run: python tools/apply_custom_message.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile firmware
        run: pio run
      - name: Commit verified firmware changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config_manager.h src/config_manager.cpp src/msp_serial.cpp
          git commit -m "Add Custom Message firmware behavior"
          git push origin HEAD:fps-custom-message
