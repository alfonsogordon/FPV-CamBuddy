name: Build Custom Message Test

on:
  push:
    branches: [fps-custom-message]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fps-custom-message
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate configurator transform
        run: python tools/build_fps_pages.py
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile firmware
        run: pio run
