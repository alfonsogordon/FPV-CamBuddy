name: Check pre-V1 fixes
on:
  pull_request:
    paths:
      - 'web/fps-stage3-parity.js'
      - 'web/fps-theme.css'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check focused fixes
        run: |
          grep -F "const CRAFT_DEFAULT='{res} {fps}'" web/fps-stage3-parity.js
          grep -F "healCraftTemplate" web/fps-stage3-parity.js
          grep -F "syncGoProNote" web/fps-stage3-parity.js
          grep -F '#fpsGoProConnectionNote' web/fps-theme.css
