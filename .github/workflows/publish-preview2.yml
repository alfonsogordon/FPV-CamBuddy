name: Publish Preview 2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: |
          pio run -e esp32dev
          pio run -e esp32c3supermini
          mkdir -p firmware
          cp .pio/build/esp32dev/bootloader.bin firmware/bootloader-esp32dev.bin
          cp .pio/build/esp32dev/partitions.bin firmware/partitions-esp32dev.bin
          cp .pio/build/esp32dev/firmware.bin firmware/firmware-esp32dev.bin
          cp .pio/build/esp32c3supermini/bootloader.bin firmware/bootloader-esp32c3supermini.bin
          cp .pio/build/esp32c3supermini/partitions.bin firmware/partitions-esp32c3supermini.bin
          cp .pio/build/esp32c3supermini/firmware.bin firmware/firmware-esp32c3supermini.bin
      - name: Publish Preview 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0-preview.2 --yes --cleanup-tag 2>/dev/null || true
          git tag -f v1.0.0-preview.2 "$GITHUB_SHA"
          git push origin refs/tags/v1.0.0-preview.2 --force
          gh release create v1.0.0-preview.2 firmware/* --title "FPSteVe Edition V1 Preview — Hardware Test" --notes "Current pre-V1 hardware-test build from main. Fresh current-Betaflight defaults enable OSD Templates with all four agreed Custom Messages, includes the single global Save/Apply flow, and retains GoPro keep-alive/wake-guard behaviour. Power-cycle the FreeCLinker after flashing before configuration." --prerelease
      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo ${{ github.repository }}
