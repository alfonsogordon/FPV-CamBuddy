name: Validate FPV CamBuddy

on:
  pull_request:
  push:
    branches:
      - main
      - gopro-gps-time-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate and validate production web site
        run: python3 tools/build_fps_site.py
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build ESP32-C3 and ESP32 firmware
        run: pio run -e esp32c3supermini -e esp32dev
      - name: Publish ESP32-C3 test firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: freeclinker-stage3-esp32c3
          if-no-files-found: error
          retention-days: 14
          path: |
            .pio/build/esp32c3supermini/firmware.bin
            .pio/build/esp32c3supermini/bootloader.bin
            .pio/build/esp32c3supermini/partitions.bin
      - name: Publish ESP32 test firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: freeclinker-stage3-esp32
          if-no-files-found: error
          retention-days: 14
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/bootloader.bin
            .pio/build/esp32dev/partitions.bin
