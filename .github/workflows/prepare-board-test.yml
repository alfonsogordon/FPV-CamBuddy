name: Prepare real-board firmware parity

on:
  push:
    paths:
      - '.github/workflows/prepare-board-test.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply locked REC-only firmware semantics
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/msp_serial.cpp')
          s = p.read_text()

          old = '''bool startsWith(const char *s, const char *prefix) {
              return s && prefix && strncmp(s, prefix, strlen(prefix)) == 0;
          }

          void blankRecToken(char *text) {'''
          new = '''bool startsWith(const char *s, const char *prefix) {
              return s && prefix && strncmp(s, prefix, strlen(prefix)) == 0;
          }

          bool templateHasStatus(const char *tpl) {
              return tpl && (strstr(tpl, "{state}") || strstr(tpl, "{stateonly}"));
          }

          void blankRecToken(char *text) {'''
          if old not in s:
              raise SystemExit('Could not find startsWith insertion point')
          s = s.replace(old, new, 1)

          old = '''    const char *state = "RDY";
              if (cameraError) state = "ERR";
              else if (cameraRecording && (!recOnlyWhenArmed || _armed)) state = "REC";'''
          new = '''    const char *state = "RDY";
              if (cameraError) state = "ERR";
              else if (cameraRecording) state = "REC";'''
          if old not in s:
              raise SystemExit('Could not find state selection block')
          s = s.replace(old, new, 1)

          old = '''    char text[TEXT_LIMIT + 1] = {};
              expandTemplate(tpl ? tpl : "", data, state, text, sizeof(text));

              // Flash only the REC token, not the whole line.'''
          new = '''    char text[TEXT_LIMIT + 1] = {};
              const bool recOnlyTakeover = recOnlyWhenArmed && _armed && cameraRecording &&
                                           !cameraError && templateHasStatus(tpl);
              if (recOnlyTakeover) {
                  // Locked V1 behaviour: only a Status-containing destination is
                  // temporarily replaced by REC while armed + recording. All other
                  // destinations remain untouched; the configured template returns
                  // immediately when recording stops or the FC disarms.
                  snprintf(text, sizeof(text), "REC");
              } else {
                  expandTemplate(tpl ? tpl : "", data, state, text, sizeof(text));
              }

              // Flash only the REC token, not the whole line.'''
          if old not in s:
              raise SystemExit('Could not find template expansion block')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Remove one-shot workflow
        run: rm .github/workflows/prepare-board-test.yml
      - name: Commit firmware parity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/msp_serial.cpp .github/workflows/prepare-board-test.yml
          git commit -m "Match firmware REC-only behavior to signed-off preview"
          git push
