name: Build MAX2 V1.0.1 RC

on:
  push:
    branches:
      - max2-stable-patch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-max2-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: max2-stable-patch

      - name: Verify isolated MAX2 wake-state fix
        shell: python
        run: |
          from pathlib import Path
          s = Path('src/gopro_camera.cpp').read_text()
          expected = 'awake = (state == 0x01 || state == 0x05);'
          if expected not in s:
              raise SystemExit('MAX2 wake-state fix missing; refusing to build')
          print('MAX2 wake-state fix present')

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate and validate production web site
        run: python3 tools/build_fps_site.py

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ESP32-C3 and ESP32 firmware
        run: pio run -e esp32c3supermini -e esp32dev

      - name: Publish ESP32-C3 MAX2 RC firmware
        uses: actions/upload-artifact@v4
        with:
          name: freeclinker-v1.0.1-rc-max2-esp32c3
          if-no-files-found: error
          retention-days: 14
          path: |
            .pio/build/esp32c3supermini/firmware.bin
            .pio/build/esp32c3supermini/bootloader.bin
            .pio/build/esp32c3supermini/partitions.bin

      - name: Publish ESP32 MAX2 RC firmware
        uses: actions/upload-artifact@v4
        with:
          name: freeclinker-v1.0.1-rc-max2-esp32
          if-no-files-found: error
          retention-days: 14
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/bootloader.bin
            .pio/build/esp32dev/partitions.bin

      - name: Publish C3 RC to experimental test flasher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch experimental "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/freeclinker-experimental
          mkdir -p /tmp/freeclinker-experimental/web/firmware/v1.0.1-rc-max2
          cp .pio/build/esp32c3supermini/bootloader.bin /tmp/freeclinker-experimental/web/firmware/v1.0.1-rc-max2/bootloader-esp32c3supermini.bin
          cp .pio/build/esp32c3supermini/partitions.bin /tmp/freeclinker-experimental/web/firmware/v1.0.1-rc-max2/partitions-esp32c3supermini.bin
          cp .pio/build/esp32c3supermini/firmware.bin /tmp/freeclinker-experimental/web/firmware/v1.0.1-rc-max2/firmware-esp32c3supermini.bin
          cat > /tmp/freeclinker-experimental/web/max2-test.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeCLinker MAX2 RC Test</title><script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script><style>body{margin:0;background:#090d14;color:#e6edf7;font:14px/1.6 'Courier New',monospace;display:grid;place-items:center;min-height:100vh}.card{max-width:520px;margin:20px;padding:28px;border:1px solid #6f5b89;border-radius:10px;background:#0e151f;text-align:center}h1{color:#c29cff;font-size:21px}.warn{color:#fbbf24;font-weight:bold}.note{color:#a397b5}esp-web-install-button::part(button){font:14px 'Courier New',monospace;padding:10px 28px;border-radius:4px;border:1px solid #9b6cff;background:#7c3aed;color:#fff;cursor:pointer}a{color:#b78cff}</style></head><body><div class="card"><h1>V1.0.1 RC - MAX2 Test</h1><p class="warn">TEST FIRMWARE - ESP32-C3 SUPER MINI ONLY</p><p>V1.0.0 firmware with the isolated GoPro MAX2 wake-state fix.</p><esp-web-install-button manifest="max2-test-manifest.json"><button slot="activate">Connect &amp; Flash MAX2 RC</button></esp-web-install-button><p class="note">Use Chrome or Edge desktop. Power-cycle the C3 after flashing, then use the experimental Configurator normally.</p><p><a href="config.html">Experimental Configurator</a></p></div></body></html>
          EOF
          cat > /tmp/freeclinker-experimental/web/max2-test-manifest.json <<'EOF'
          {"name":"FreeCLinker FPSteVe Edition - V1.0.1 RC MAX2 Test","version":"v1.0.1-rc-max2","new_install_prompt_erase":true,"builds":[{"chipFamily":"ESP32-C3","parts":[{"path":"firmware/v1.0.1-rc-max2/bootloader-esp32c3supermini.bin","offset":0},{"path":"firmware/v1.0.1-rc-max2/partitions-esp32c3supermini.bin","offset":32768},{"path":"firmware/v1.0.1-rc-max2/firmware-esp32c3supermini.bin","offset":65536}]}]}
          EOF
          cd /tmp/freeclinker-experimental
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/max2-test.html web/max2-test-manifest.json web/firmware/v1.0.1-rc-max2
          if git diff --cached --quiet; then
            echo 'Experimental MAX2 test flasher already current'
          else
            git commit -m 'Add MAX2 V1.0.1 RC test flasher'
            git push origin experimental
          fi
