name: Build MAX2 V1.0.1 RC

on:
  push:
    branches:
      - max2-stable-patch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-max2-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: max2-stable-patch

      - name: Verify isolated MAX2 wake-state fix
        shell: python
        run: |
          from pathlib import Path
          s = Path('src/gopro_camera.cpp').read_text()
          expected = 'awake = (state == 0x01 || state == 0x05);'
          if expected not in s:
              raise SystemExit('MAX2 wake-state fix missing; refusing to build')
          print('MAX2 wake-state fix present')

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate and validate production web site
        run: python3 tools/build_fps_site.py

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ESP32-C3 and ESP32 firmware
        run: pio run -e esp32c3supermini -e esp32dev

      - name: Publish ESP32-C3 MAX2 RC firmware
        uses: actions/upload-artifact@v4
        with:
          name: freeclinker-v1.0.1-rc-max2-esp32c3
          if-no-files-found: error
          retention-days: 14
          path: |
            .pio/build/esp32c3supermini/firmware.bin
            .pio/build/esp32c3supermini/bootloader.bin
            .pio/build/esp32c3supermini/partitions.bin

      - name: Publish ESP32 MAX2 RC firmware
        uses: actions/upload-artifact@v4
        with:
          name: freeclinker-v1.0.1-rc-max2-esp32
          if-no-files-found: error
          retention-days: 14
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/bootloader.bin
            .pio/build/esp32dev/partitions.bin
