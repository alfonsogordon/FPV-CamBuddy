name: Update FPV CamBuddy self links

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FPV_CAMBUDDY }}
      - name: Update copied-project URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'https://alfonsogordon.github.io/freeclinker': 'https://alfonsogordon.github.io/FPV-CamBuddy',
              'https://github.com/alfonsogordon/freeclinker': 'https://github.com/alfonsogordon/FPV-CamBuddy',
          }
          skip = {'.git'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(part in skip for part in p.parts):
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = s
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != s:
                  p.write_text(new, encoding='utf-8')
                  print('updated', p)
          PY
          rm -f .github/workflows/update-cambuddy-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No link changes required"
            exit 0
          fi
          git commit -m "Point project links to FPV CamBuddy"
          git push
