name: Finalize Bench Preview
on:
  push:
    branches: [live-bench-sim]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-bench-sim
      - name: Use supplied DVR background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/test.html')
          s=p.read_text()
          s=s.replace("background:linear-gradient(115deg,#241535,#100b18 60%,#05080d);border:2px", "background:#05080d url('osd-preview-bg.jpg') left center/cover no-repeat;border:2px")
          p.write_text(s)
          assert "url('osd-preview-bg.jpg') left center/cover no-repeat" in s
          PY
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile ESP32-C3 and ESP32
        run: pio run -e esp32c3supermini -e esp32dev
      - name: Commit finalized preview
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/test.html web/osd-preview-bg.jpg
          git diff --cached --quiet || git commit -m "Finalize live OSD bench preview"
          git push origin HEAD:live-bench-sim
