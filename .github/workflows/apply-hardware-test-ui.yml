name: Apply hardware-test UI updates
on:
  push:
    paths: ['.github/workflows/apply-hardware-test-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested changes
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/gopro_camera.cpp')
          s=p.read_text()
          assert 'now - _lastKeepAliveMs >= 20000' in s
          s=s.replace('now - _lastKeepAliveMs >= 20000','now - _lastKeepAliveMs >= 10000')
          p.write_text(s)

          p=Path('web/flash.html')
          s=p.read_text()
          # Add a clear post-flash next step. ESP Web Tools owns its internal completion modal,
          # so reveal our own FPSteVe completion panel when the install dialog closes.
          s=s.replace('.err{color:#f87171;font-size:13px}', '.err{color:#f87171;font-size:13px}.post-flash{display:none;margin-top:16px;padding:16px;border:1px solid #9b6cff;border-radius:6px;background:#211638;text-align:center}.post-flash.show{display:block}.post-flash .horns{font-size:32px;display:block;margin-bottom:6px}.post-flash strong{display:block;color:#f3f4f6;margin-bottom:8px}.config-btn{display:inline-block;padding:8px 18px;border:1px solid #9b6cff;border-radius:4px;background:#7c3aed;color:#fff!important;font-size:13px;text-decoration:none!important}')
          needle='<p class="note">Requires <strong>Chrome</strong> or <strong>Edge</strong> desktop.<br>ESP32-C3 Super Mini is selected by default. Hold <strong>BOOT</strong> while plugging in if needed to enter download mode.</p>'
          repl=needle+'<div id="postFlash" class="post-flash"><span class="horns">🤘</span><strong>Flash complete!</strong><p class="note" style="margin-bottom:10px">Power-cycle the FreeCLinker board, then open the Config UI.</p><a class="config-btn" href="config.html">Configure FreeCLinker →</a></div>'
          assert needle in s
          s=s.replace(needle,repl)
          marker="if(!('serial'in navigator))document.getElementById('noSerial').classList.add('show');"
          hook="installBtn.addEventListener('state-changed',e=>{const st=String((e.detail&&e.detail.state)||'').toLowerCase();if(st.includes('finished')||st.includes('installed')||st.includes('complete'))document.getElementById('postFlash').classList.add('show');});installBtn.addEventListener('closed',()=>document.getElementById('postFlash').classList.add('show'));"
          assert marker in s
          s=s.replace(marker,hook+marker)
          p.write_text(s)

          # Keep README documentation aligned with real-board observations.
          p=Path('README.md')
          s=p.read_text()
          note='''\n### GoPro first connection\n\nAfter flashing an ESP32-C3, **power-cycle the FreeCLinker board**. With the GoPro awake, FreeCLinker should discover and connect to it automatically; during current HERO11 Mini/MAX2 testing there is **no need to put the GoPro into its Pair/Connect Device screen**. Wake Guard is intended to ignore a sleeping GoPro rather than wake it during scanning.\n\nWhile connected, FPSteVe Edition currently sends an experimental Open GoPro keep-alive every **10 seconds**. This interval is under real-hardware validation and may change before V1.0.\n'''
          if '### GoPro first connection' not in s:
              s += note
          else:
              import re
              s=re.sub(r'### GoPro first connection.*?(?=\n### |\Z)',note.strip()+'\n',s,flags=re.S)
          p.write_text(s)
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-hardware-test-ui.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/gopro_camera.cpp web/flash.html README.md .github/workflows/apply-hardware-test-ui.yml
          git commit -m "Test 10s GoPro keep-alive and improve post-flash flow"
          git push