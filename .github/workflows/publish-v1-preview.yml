name: Publish V1 Preview

on:
  push:
    paths:
      - '.github/workflows/publish-v1-preview.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: |
          pio run -e esp32dev
          pio run -e esp32c3supermini
      - name: Collect firmware
        run: |
          mkdir -p firmware
          cp .pio/build/esp32dev/bootloader.bin firmware/bootloader-esp32dev.bin
          cp .pio/build/esp32dev/partitions.bin firmware/partitions-esp32dev.bin
          cp .pio/build/esp32dev/firmware.bin firmware/firmware-esp32dev.bin
          cp .pio/build/esp32c3supermini/bootloader.bin firmware/bootloader-esp32c3supermini.bin
          cp .pio/build/esp32c3supermini/partitions.bin firmware/partitions-esp32c3supermini.bin
          cp .pio/build/esp32c3supermini/firmware.bin firmware/firmware-esp32c3supermini.bin
      - name: Publish V1 Preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f v1.0.0-preview
          git push origin refs/tags/v1.0.0-preview --force
          gh release delete v1.0.0-preview --yes --cleanup-tag 2>/dev/null || true
          git tag -f v1.0.0-preview
          git push origin refs/tags/v1.0.0-preview --force
          gh release create v1.0.0-preview firmware/* --prerelease --title "FPSteVe Edition V1 Preview" --notes "V1 Preview hardware-test build. Includes signed-off REC-only behaviour and top-priority camera warnings. Intended for ESP32-C3 Super Mini bench and real-board validation before V1."
      - name: Remove one-shot workflow and redeploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/publish-v1-preview.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/publish-v1-preview.yml
          git commit -m "Publish FPSteVe Edition V1 Preview"
          git push
          gh workflow run pages.yml --repo ${{ github.repository }}
