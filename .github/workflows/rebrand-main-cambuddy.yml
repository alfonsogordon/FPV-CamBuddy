name: Rebrand stable main to FPV CamBuddy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/rebrand-main-cambuddy.yml']

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.FPV_CAMBUDDY }}
          fetch-depth: 0
      - name: Branding-only rename
        shell: python
        run: |
          from pathlib import Path
          skip={'.git'}
          exts={'.md','.html','.js','.css','.json','.yml','.yaml','.py','.h','.hpp','.c','.cpp','.txt','.ini'}
          replacements=[
            ('https://alfonsogordon.github.io/freeclinker','https://alfonsogordon.github.io/FPV-CamBuddy'),
            ('https://github.com/alfonsogordon/freeclinker','https://github.com/alfonsogordon/FPV-CamBuddy'),
            ('FreeCLinker — FPSteVe Edition','FPV CamBuddy · by FPSteVe'),
            ('FreeCLinker - FPSteVe Edition','FPV CamBuddy · by FPSteVe'),
            ('FreeCLinker FPSteVe Edition','FPV CamBuddy · by FPSteVe'),
            ('FPSteVe Edition is built on FreeCLinker by sheeprine.','FPV CamBuddy is built on FreeCLinker by sheeprine.'),
            ('FPSteVe Edition adds the Easy Config','FPV CamBuddy adds the Easy Config'),
            ('Flash FreeCLinker','Flash FPV CamBuddy'),
            ('FreeCLinker - <em class="edition">FPSteVe Edition</em> handles the camera.','FPV CamBuddy handles the camera.'),
            ('FreeCLinker — <em class="edition">FPSteVe Edition</em> handles the camera.','FPV CamBuddy handles the camera.'),
          ]
          changed=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or any(x in skip for x in p.parts) or p.suffix.lower() not in exts: continue
            try: s=p.read_text(encoding='utf-8')
            except UnicodeDecodeError: continue
            old=s
            for a,b in replacements: s=s.replace(a,b)
            # General visible/document branding, but preserve upstream FreeCLinker references.
            if 'sheeprine' not in p.name.lower():
              s=s.replace('FPSteVe Edition','FPV CamBuddy')
            if s!=old:
              p.write_text(s,encoding='utf-8'); changed.append(str(p))
          print('\n'.join(changed))
      - name: Guard upstream attribution and stable version
        shell: bash
        run: |
          grep -R "FreeCLinker by sheeprine" README.md QUICKSTART.md web/index.html
          grep -R "sheeprine/freeclinker" README.md QUICKSTART.md web/index.html
          grep -q "FPV CamBuddy" web/index.html
          if grep -q "Original FPV CamBuddy" web/index.html; then exit 1; fi
          if grep -q "FPV CamBuddy by sheeprine" web/index.html; then exit 1; fi
      - name: Commit stable branding
        shell: bash
        run: |
          rm .github/workflows/rebrand-main-cambuddy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Rebrand stable main to FPV CamBuddy" || exit 0
          git push origin main
