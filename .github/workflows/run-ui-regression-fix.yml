name: Run UI regression fix

on:
  push:
    branches:
      - fix-pre-v1-ui-regressions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pre-v1-ui-regressions
          fetch-depth: 0

      - name: Repair configurator wiring and visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Restore the native disarm-delay control to the base DOM so the
          # original inline config code captures a real element before any
          # FPSteVe enhancement scripts run.
          p = Path('web/config.html')
          s = p.read_text(encoding='utf-8')
          if 'id="disarmDelay"' not in s:
              anchor = '''      <div class="card-header">\n        <h2>Camera Mode Switch</h2>\n      </div>\n\n      <!-- AUX Channel -->'''
              block = '''      <div class="card-header">\n        <h2>Camera Mode Switch</h2>\n      </div>\n\n      <!-- Disarm delay: always available, including normal arm-switch mode -->\n      <div class="cfg-field" style="flex-direction:column; align-items:flex-start;">\n        <div class="cfg-field-name">Disarm delay</div>\n        <div class="cfg-field-desc">Delay between FC disarm and stopping the recording. This applies even when AUX Camera Controls is off. 0 = stop immediately.</div>\n        <div class="num-wrap">\n          <input type="number" id="disarmDelay" min="0" max="60000" step="500" value="5000" disabled>\n          <span class="num-unit">ms</span>\n          <span class="num-equiv" id="delayEquiv"></span>\n        </div>\n      </div>\n\n      <!-- AUX Channel -->'''
              if anchor not in s:
                  raise SystemExit('Camera Mode Switch anchor not found')
              s = s.replace(anchor, block, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Keep the native delay row in place and put ONLY AUX-specific
          # controls inside the AUX master section. Also force a visibility
          # refresh after authoritative board reads so programmatic checkbox
          # updates cannot leave stale expanded sections on screen.
          p = Path('web/fps-ui-rebuild.js')
          s = p.read_text(encoding='utf-8')
          old = "const aux=$('auxChannel'),auxCard=aux?.closest('.config-card');if(auxCard){const rows=[...auxCard.querySelectorAll(':scope > .cfg-field')];const head=auxCard.querySelector('.card-header');head.innerHTML='<h2>Camera Mode Switch</h2>';const delay=$('disarmDelay');if(delay){const delayRow=field('Disarm delay',delay);delayRow.classList.add('fps-disarm-delay-row');const txt=delayRow.querySelector('label');if(txt){txt.innerHTML='<strong>Disarm delay</strong><div class=\"fps-inline-desc\">Delay between FC disarm and stopping recording. This applies to the normal arm-switch workflow too, so it remains available when AUX Camera Controls is off.</div>';}head.after(delayRow)}const a=section('AUX Camera Controls','Use a Betaflight AUX channel to control camera behaviour. Leave this off if you only want arming/disarming the quad to start and stop recording.','fpsAuxMaster',rows);delayRow?.insertAdjacentElement('afterend',a);put('fpsAuxMaster',st.auxEnabled)}"
          new = "const aux=$('auxChannel'),auxCard=aux?.closest('.config-card');if(auxCard){const head=auxCard.querySelector('.card-header');head.innerHTML='<h2>Camera Mode Switch</h2>';const delay=$('disarmDelay'),delayRow=delay?.closest('.cfg-field');if(delayRow)delayRow.classList.add('fps-disarm-delay-row');const rows=[...auxCard.querySelectorAll(':scope > .cfg-field')].filter(r=>r!==delayRow);const a=section('AUX Camera Controls','Use a Betaflight AUX channel to control camera behaviour. Leave this off if you only want arming/disarming the quad to start and stop recording.','fpsAuxMaster',rows);if(delayRow)delayRow.insertAdjacentElement('afterend',a);else head.after(a);put('fpsAuxMaster',st.auxEnabled)}"
          if old not in s:
              raise SystemExit('AUX rebuild block not found')
          s = s.replace(old, new, 1)

          old2 = "$('fpsApplyAll').onclick=applyAll;refresh();window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save)"
          new2 = "$('fpsApplyAll').onclick=applyAll;window.fpsRefreshUiVisibility=refresh;document.addEventListener('fps-config-read-complete',()=>setTimeout(refresh,0));refresh();window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save)"
          if old2 not in s:
              raise SystemExit('refresh hook anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Build-time assertions for the exact regressions we just saw.
          p = Path('tools/build_fps_site.py')
          s = p.read_text(encoding='utf-8')
          marker = "print('FPSteVe production web site generated and validated')"
          checks = '''\n# Pre-V1 UI regression guards\nif 'id="disarmDelay"' not in final:\n    raise SystemExit('Configurator lost Disarm Delay control')\nui = read('web/fps-ui-rebuild.js')\nif "filter(r=>r!==delayRow)" not in ui:\n    raise SystemExit('AUX section no longer excludes always-visible Disarm Delay row')\nif "fps-config-read-complete" not in ui or "fpsRefreshUiVisibility" not in ui:\n    raise SystemExit('Authoritative board read no longer refreshes master/child visibility')\n'''
          if 'Pre-V1 UI regression guards' not in s:
              if marker not in s:
                  raise SystemExit('build validation marker not found')
              s = s.replace(marker, checks + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/run-ui-regression-fix.yml

      - name: Sanity check generated site
        run: |
          python3 tools/build_fps_site.py
          grep -q 'id="disarmDelay"' web/config.html
          grep -q 'fps-config-read-complete' web/fps-ui-rebuild.js

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/config.html web/fps-ui-rebuild.js tools/build_fps_site.py .github/workflows/run-ui-regression-fix.yml
          git commit -m 'Fix pre-V1 UI regressions and preserve control wiring'
          git push origin HEAD:fix-pre-v1-ui-regressions
