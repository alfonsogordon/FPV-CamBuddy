name: Fix board-test findings
on:
  push:
    paths: ['.github/workflows/fix-board-test-findings.yml']
permissions:
  contents: write
  actions: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested behaviour fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/gopro_camera.h'); s=p.read_text()
          s=s.replace('    void sendStatusPoll();\n', '    void sendStatusPoll();\n    void sendKeepAlive();\n')
          s=s.replace('    uint32_t                 _lastStatusPollMs = 0;\n', '    uint32_t                 _lastStatusPollMs = 0;\n    uint32_t                 _lastKeepAliveMs = 0;\n')
          p.write_text(s)

          p=Path('src/gopro_camera.cpp'); s=p.read_text()
          old='''    if (_gpConnected && _queryChar) {\n        const uint32_t now = millis();\n        if (now - _lastStatusPollMs >= 1000) {\n            _lastStatusPollMs = now;\n            sendStatusPoll();\n        }\n        return;\n    }'''
          new='''    if (_gpConnected && _queryChar) {\n        const uint32_t now = millis();\n        // Open GoPro requires a periodic Keep Alive while a client owns the BLE\n        // session. This prevents Auto Power Down while we are already connected,\n        // but is never sent while scanning, so sleeping nearby GoPros remain asleep.\n        if (now - _lastKeepAliveMs >= 3000) {\n            _lastKeepAliveMs = now;\n            sendKeepAlive();\n        }\n        if (now - _lastStatusPollMs >= 1000) {\n            _lastStatusPollMs = now;\n            sendStatusPoll();\n        }\n        return;\n    }'''
          if old not in s: raise SystemExit('GoPro update block not found')
          s=s.replace(old,new)
          marker='''// ─── Scan ────────────────────────────────────────────────────────────────────'''
          keep='''void GoProCamera::sendKeepAlive() {\n    if (!_settingChar || !_bleConnected) return;\n    // Official Open GoPro keep-alive signal: LED setting (ID 91) with the\n    // reserved non-functional value 66. It refreshes the camera's client\n    // keep-alive timer without changing the user's LED setting.\n    sendSetting(91, 66);\n}\n\n'''
          if marker not in s: raise SystemExit('GoPro scan marker not found')
          s=s.replace(marker,keep+marker,1)
          s=s.replace('    _lastStatusPollMs = 0;','    _lastStatusPollMs = 0;\n    _lastKeepAliveMs = 0;')
          p.write_text(s)

          p=Path('web/fps-integrated-preview.js'); s=p.read_text()
          old="""async function armToggle(){const next=!armed;if(!demo()&&!(await command('sim arm '+(next?1:0))))return;armed=next;if(next){armedOnce=true;recording=true;recStarted=performance.now()}else recording=false;const s=$('fpsPreviewNotice');if(s)s.textContent=demo()?'Virtual FC state changed':'Bench arm simulation sent to C3'}"""
          new="""async function armToggle(){const next=!armed;if(!demo()&&!(await command('sim arm '+(next?1:0))))return;armed=next;if(next){armedOnce=true;recording=true;recStarted=performance.now()}else if(recording&&val('stopOnDisarm',true)){const delay=Math.max(0,Number(val('disarmDelay',0))||0);if(delay===0)recording=false;else setTimeout(()=>{if(!armed)recording=false},delay)}const s=$('fpsPreviewNotice');if(s)s.textContent=demo()?'Virtual FC state changed':'Bench arm simulation sent to C3'}"""
          if old not in s: raise SystemExit('preview armToggle not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('web/fps-ui-rebuild.js'); s=p.read_text()
          needle=""" const wifi=$('wifiApEnabled'),wifiRow=wifi?.closest('.cfg-field'),wifiChildren=wifiRow?[...wifiRow.children].slice(2):[];"""
          msg=""" const wake=$('wakeGuard');if(wake){const r=wake.closest('.cfg-field');if(r&&!document.getElementById('fpsGoProConnectionNote')){const n=document.createElement('div');n.id='fpsGoProConnectionNote';n.className='fps-note';n.textContent='GoPro connection: an awake camera is discovered and connected automatically. While connected, FreeCLinker sends the official Open GoPro keep-alive so the camera stays awake. Sleeping GoPros found during scanning are ignored and will not be woken accidentally.';r.insertAdjacentElement('afterend',n)}}\n"""+needle
          if needle not in s: raise SystemExit('UI insertion point not found')
          s=s.replace(needle,msg,1)
          p.write_text(s)
          PY
      - name: Commit fixes and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/fix-board-test-findings.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/gopro_camera.cpp src/gopro_camera.h web/fps-integrated-preview.js web/fps-ui-rebuild.js .github/workflows/fix-board-test-findings.yml
          git commit -m "Keep connected GoPro awake and preserve delayed REC state"
          git push
          gh workflow run pages.yml --repo ${{ github.repository }}
