name: Apply V1.0.2 multi-brand expansion

on:
  push:
    branches: [experimental]
    paths:
      - .github/workflows/apply-v102-expansion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental
      - name: Apply robust multi-brand coordinator patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          exec(compile(Path('tools/apply_multibrand.py').read_text(), 'tools/apply_multibrand.py', 'exec'))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add multi-brand Multi Cam coordinator'
          git push origin experimental
