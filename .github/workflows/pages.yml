name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Validate FPV CamBuddy]
    types: [completed]
    branches: [integration/v1.0.3-rc2]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - uses: actions/checkout@v4
        with:
          ref: integration/v1.0.3-rc2
          path: devsrc
      - uses: actions/checkout@v4
        with:
          ref: test/rc1-gopro-startup-diagnostics
          path: gregsrc
      - name: Generate main site
        working-directory: stable
        run: python3 tools/build_fps_site.py
      - name: Stage development configurator
        run: |
          mkdir -p stable/web/dev
          cp devsrc/web/config.html stable/web/dev/config.html
          cp devsrc/web/*.js stable/web/dev/
          cp devsrc/web/*.css stable/web/dev/
          cp devsrc/web/osd-preview-bg.jpg stable/web/dev/osd-preview-bg.jpg
          find devsrc/web -maxdepth 1 -type f | grep -E "\.(png|jpg|jpeg|svg|webp|json)$" | while IFS= read -r asset; do cp "$asset" stable/web/dev/; done || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('stable/web/dev/config.html')
          s=p.read_text()
          s=s.replace('</body>', '<div style="position:fixed;bottom:0;left:0;right:0;padding:6px;background:#452d05;color:#fff;text-align:center;z-index:99999;font:700 12px system-ui">DEVELOPMENT CONFIGURATOR — experimental firmware</div></body>')
          p.write_text(s)
          PY
      - name: Publish Greg RC1 startup diagnostics test and matching configurator
        run: |
          mkdir -p stable/web/dev/greg-startup/firmware
          cp gregsrc/web/startup-diagnostics-flash.html stable/web/dev/greg-startup/flash.html
          cp gregsrc/web/config.html stable/web/dev/greg-startup/config.html
          cp gregsrc/web/*.js stable/web/dev/greg-startup/
          cp gregsrc/web/*.css stable/web/dev/greg-startup/
          cp gregsrc/web/osd-preview-bg.jpg stable/web/dev/greg-startup/osd-preview-bg.jpg
          cp -R gregsrc/web/firmware/startup-diagnostics stable/web/dev/greg-startup/firmware/
          sed -i 's@https://alfonsogordon.github.io/FPV-CamBuddy/v1.0.3/config.html@config.html@g' stable/web/dev/greg-startup/flash.html
          sed -i 's@https://raw.githubusercontent.com/alfonsogordon/FPV-CamBuddy/test/rc1-gopro-startup-diagnostics/web/firmware/startup-diagnostics@firmware/startup-diagnostics@g' stable/web/dev/greg-startup/flash.html
          test -s stable/web/dev/greg-startup/osd-preview-bg.jpg
          for board in esp32dev esp32c3supermini; do
            for part in bootloader partitions firmware; do
              test -s "stable/web/dev/greg-startup/firmware/startup-diagnostics/$part-$board.bin"
            done
          done
      - name: Build stable firmware from main
        working-directory: stable
        run: |
          python3 -m pip install platformio
          sed -i "s/^platform = espressif32$/platform = espressif32@6.9.0/" platformio.ini
          pio run -e esp32c3supermini -e esp32dev
          mkdir -p web/firmware/v1.0.2
          for board in esp32c3supermini esp32dev; do
            for part in bootloader partitions firmware; do
              src=".pio/build/$board/$part.bin"
              test -s "$src" || { echo "Missing stable $src"; exit 1; }
              cp "$src" "web/firmware/v1.0.2/$part-$board.bin"
            done
          done
      - name: Publish stable firmware version index
        working-directory: stable
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('web/firmware')
          entries=[]
          for folder in sorted(root.iterdir(),reverse=True):
              if not folder.is_dir(): continue
              files=[folder/f'{part}-{board}.bin' for board in ('esp32dev','esp32c3supermini') for part in ('bootloader','partitions','firmware')]
              if not all(f.is_file() and f.stat().st_size>100 for f in files): continue
              tag=folder.name
              if tag=='v1.0.2':
                  label='v1.0.2 — Stable firmware (main)'
                  priority=0
              else: continue
              entries.append((priority,dict(tag_name=tag,name=label,display_name=label,is_candidate=False,published_at='',html_url='https://github.com/alfonsogordon/FPV-CamBuddy/releases')))
          entries.sort(key=lambda item:item[0])
          result=[entry for _,entry in entries]
          if not result: raise SystemExit('No complete stable firmware bundles')
          (root/'versions.json').write_text(json.dumps(result,indent=2))
          print('Stable firmware versions:',[e['tag_name'] for e in result])
          PY
      - name: Build RC2 development firmware from pinned branch
        working-directory: devsrc
        run: |
          python3 -m pip install platformio
          pio run -e esp32c3supermini -e esp32dev
      - name: Stage RC2 development firmware
        run: |
          sha=$(git -C devsrc rev-parse HEAD)
          version="rc2-${sha:0:8}"
          dest="stable/web/dev/firmware/$version"
          mkdir -p "$dest"
          for board in esp32c3supermini esp32dev; do
            for part in bootloader partitions firmware; do
              src="devsrc/.pio/build/$board/$part.bin"
              test -s "$src" || { echo "Missing development $src"; exit 1; }
              cp "$src" "$dest/$part-$board.bin"
            done
          done
          VERSION="$version" SHA="$sha" python3 - <<'PY'
          import json,os
          from pathlib import Path
          version=os.environ['VERSION']; sha=os.environ['SHA']
          entries=[dict(tag_name=version,display_name='v1.0.3 RC2 — '+sha[:8]+' (build from branch)',sha=sha,published_at='GitHub Pages deployment',html_url='https://github.com/alfonsogordon/FPV-CamBuddy/tree/integration/v1.0.3-rc2',is_candidate=True)]
          Path('stable/web/dev/firmware/versions.json').write_text(json.dumps(entries))
          PY
      - name: Validate staged flasher versions and firmware files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('stable/web')
          versions=json.loads((root/'dev/firmware/versions.json').read_text())
          assert versions, 'No development versions staged'
          for v in versions:
              d=root/'dev/firmware'/v['tag_name']
              for board in ('esp32dev','esp32c3supermini'):
                  for part in ('bootloader','partitions','firmware'):
                      f=d/f'{part}-{board}.bin'
                      assert f.is_file() and f.stat().st_size > 100, f'Missing/empty {f}'
          stable=json.loads((root/'firmware/versions.json').read_text())
          assert stable, 'No stable firmware indexed'
          for v in stable:
              d=root/'firmware'/v['tag_name']
              for board in ('esp32dev','esp32c3supermini'):
                  for part in ('bootloader','partitions','firmware'):
                      f=d/f'{part}-{board}.bin'
                      assert f.is_file() and f.stat().st_size>100, f'Missing stable {f}'
          assert (root/'flash.html').is_file()
          assert (root/'dev/flash.html').is_file()
          assert (root/'dev/config.html').is_file()
          print('Main and dev flasher pages and all indexed development firmware binaries verified')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stable/web
      - id: deployment
        uses: actions/deploy-pages@v4
