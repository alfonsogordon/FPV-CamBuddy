name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Validate FPV CamBuddy]
    types: [completed]
    branches: [integration/v1.0.3-rc2]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - uses: actions/checkout@v4
        with:
          ref: integration/v1.0.3-rc2
          path: devsrc
      - name: Generate main site
        working-directory: stable
        run: python3 tools/build_fps_site.py
      - name: Stage development configurator
        run: |
          mkdir -p stable/web/dev
          cp devsrc/web/config.html stable/web/dev/config.html
          cp devsrc/web/*.js stable/web/dev/
          cp devsrc/web/*.css stable/web/dev/
          find devsrc/web -maxdepth 1 -type f | grep -E "\\.(png|jpg|jpeg|svg|webp|json)$" | while IFS= read -r asset; do cp "$asset" stable/web/dev/; done || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('stable/web/dev/config.html')
          s=p.read_text()
          s=s.replace('</body>', '<div style="position:fixed;bottom:0;left:0;right:0;padding:6px;background:#452d05;color:#fff;text-align:center;z-index:99999;font:700 12px system-ui">DEVELOPMENT CONFIGURATOR — experimental firmware</div></body>')
          p.write_text(s)
          PY
      - name: Download stable release binaries
        working-directory: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/firmware
          gh release list --repo "${{ github.repository }}" --limit 40 --json tagName,isPrerelease,isDraft --jq '.[] | select(.isPrerelease == false and .isDraft == false) | .tagName' | while read -r tag; do
            if echo "$tag" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
              mkdir -p "web/firmware/$tag"
              gh release download "$tag" --repo "${{ github.repository }}" --pattern '*.bin' --dir "web/firmware/$tag" --clobber || echo "Skipping release $tag: firmware assets unavailable"
            fi
          done
      - name: Build stable firmware from main
        working-directory: stable
        run: |
          python3 -m pip install platformio
          sed -i "s/^platform = espressif32$/platform = espressif32@6.9.0/" platformio.ini
          pio run -e esp32c3supermini -e esp32dev
          mkdir -p web/firmware/v1.0.2-main
          for board in esp32c3supermini esp32dev; do
            for part in bootloader partitions firmware; do
              src=".pio/build/$board/$part.bin"
              test -s "$src" || { echo "Missing stable $src"; exit 1; }
              cp "$src" "web/firmware/v1.0.2-main/$part-$board.bin"
            done
          done
      - name: Build RC2 development firmware from pinned branch
        working-directory: devsrc
        run: |
          python3 -m pip install platformio
          pio run -e esp32c3supermini -e esp32dev
      - name: Stage RC2 development firmware
        run: |
          sha=$(git -C devsrc rev-parse HEAD)
          version="rc2-${sha:0:8}"
          dest="stable/web/dev/firmware/$version"
          mkdir -p "$dest"
          for board in esp32c3supermini esp32dev; do
            for part in bootloader partitions firmware; do
              src="devsrc/.pio/build/$board/$part.bin"
              test -s "$src" || { echo "Missing development $src"; exit 1; }
              cp "$src" "$dest/$part-$board.bin"
            done
          done
          VERSION="$version" SHA="$sha" python3 - <<'PY'
          import json,os
          from pathlib import Path
          version=os.environ['VERSION']; sha=os.environ['SHA']
          entries=[dict(tag_name=version,display_name='v1.0.3 RC2 — '+sha[:8]+' (build from branch)',sha=sha,published_at='GitHub Pages deployment',html_url='https://github.com/alfonsogordon/FPV-CamBuddy/tree/integration/v1.0.3-rc2',is_candidate=True)]
          Path('stable/web/dev/firmware/versions.json').write_text(json.dumps(entries))
          PY
      - name: Validate staged flasher versions and firmware files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('stable/web')
          versions=json.loads((root/'dev/firmware/versions.json').read_text())
          assert versions, 'No development versions staged'
          for v in versions:
              d=root/'dev/firmware'/v['tag_name']
              for board in ('esp32dev','esp32c3supermini'):
                  for part in ('bootloader','partitions','firmware'):
                      f=d/f'{part}-{board}.bin'
                      assert f.is_file() and f.stat().st_size > 100, f'Missing/empty {f}'
          for board in ('esp32dev','esp32c3supermini'):\n              for part in ('bootloader','partitions','firmware'):\n                  f=root/'firmware/v1.0.2-main'/f'{part}-{board}.bin'\n                  assert f.is_file() and f.stat().st_size > 100, f'Missing stable {f}'\n          assert (root/'flash.html').is_file()
          assert (root/'dev/flash.html').is_file()
          assert (root/'dev/config.html').is_file()
          print('Main and dev flasher pages and all indexed development firmware binaries verified')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stable/web
      - id: deployment
        uses: actions/deploy-pages@v4
