name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - experimental
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - uses: actions/checkout@v4
        with:
          ref: experimental
          path: experiment
      - uses: actions/configure-pages@v5

      - name: Generate stable V1 site
        working-directory: stable
        run: python3 tools/build_fps_site.py

      - name: Download stable firmware releases
        working-directory: stable
        run: |
          mkdir -p web/firmware
          tags=$(gh release list --repo ${{ github.repository }} --limit 15 --json tagName --jq '.[].tagName')
          if [ -z "$tags" ]; then echo "No releases yet, skipping firmware download"; fi
          for tag in $tags; do
            mkdir -p "web/firmware/$tag"
            gh release download "$tag" --repo ${{ github.repository }} --pattern "*.bin" --dir "web/firmware/$tag" --clobber 2>/dev/null || echo "Failed to download assets for $tag, skipping"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate experimental site
        working-directory: experiment
        run: python3 tools/build_fps_site.py

      - name: Stage isolated experimental environment
        run: |
          rm -rf stable/web/experimental
          mkdir -p stable/web/experimental
          cp -a experiment/web/. stable/web/experimental/
          python3 - <<'PY'
          from pathlib import Path
          root=Path('stable/web/experimental')
          for p in root.glob('*.html'):
              s=p.read_text()
              marker='</body>'
              tag='<script src="experimental-banner.js"></script>'
              if tag not in s and marker in s:
                  s=s.replace(marker,tag+'\n'+marker)
                  p.write_text(s)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: stable/web/

      - uses: actions/deploy-pages@v4
        id: deploy
