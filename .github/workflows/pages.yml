name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Apply FPSteVe Edition configurator theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/config.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>FreeCLinker — Config</title>', '<title>FreeCLinker — FPSteVe Edition Config</title>')
          s = s.replace('<span class="brand">FreeCLinker</span>', '<span class="brand">FreeCLinker — FPSteVe Edition</span>')
          s = s.replace('</head>', '  <link rel="stylesheet" href="fps-theme.css">\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Download firmware releases
        run: |
          mkdir -p web/firmware
          tags=$(gh release list --repo ${{ github.repository }} --limit 15 --json tagName --jq '.[].tagName')
          if [ -z "$tags" ]; then
            echo "No releases yet, skipping firmware download"
          fi
          for tag in $tags; do
            mkdir -p "web/firmware/$tag"
            gh release download "$tag" \
              --repo ${{ github.repository }} \
              --pattern "*.bin" \
              --dir "web/firmware/$tag" \
              --clobber \
              2>/dev/null || echo "Failed to download assets for $tag, skipping"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - uses: actions/deploy-pages@v4
        id: deploy
