name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Generate FPSteVe Edition web UI
        run: |
          python3 tools/build_fps_pages.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/test.html'); s=p.read_text(encoding='utf-8'); marker='<script src="fps-preview-demo.js"></script>'
          if marker not in s:
              if '</body>' not in s: raise SystemExit('OSD Preview has no body close')
              p.write_text(s.replace('</body>',marker+'\n</body>',1),encoding='utf-8')
          c=Path('web/config.html'); cs=c.read_text(encoding='utf-8')
          # The generator still emits the historical UI helpers. Remove them and install one owner for defaults/state/visibility.
          for old in ['<script src="fps-ui-v2.js"></script>','<script src="fps-osd-method.js"></script>','<script src="fps-osd-enhancements.js"></script>','<script src="fps-osd-adaptive.js"></script>','<script src="fps-config-state.js"></script>']:
              cs=cs.replace(old,'')
          clean='<script src="fps-ui-clean.js"></script>'
          if clean not in cs:
              if '</body>' not in cs: raise SystemExit('Configurator has no body close')
              cs=cs.replace('</body>',clean+'\n</body>',1)
          c.write_text(cs,encoding='utf-8')
          h=Path('web/index.html'); hs=h.read_text(encoding='utf-8'); home='<script src="fps-home-updates.js"></script>'
          if home not in hs:
              if '</body>' not in hs: raise SystemExit('Homepage has no body close')
              h.write_text(hs.replace('</body>',home+'\n</body>',1),encoding='utf-8')
          print('FPSteVe single-owner configurator UI installed')
          PY

      - name: Download firmware releases
        run: |
          mkdir -p web/firmware
          tags=$(gh release list --repo ${{ github.repository }} --limit 15 --json tagName --jq '.[].tagName')
          if [ -z "$tags" ]; then echo "No releases yet, skipping firmware download"; fi
          for tag in $tags; do
            mkdir -p "web/firmware/$tag"
            gh release download "$tag" --repo ${{ github.repository }} --pattern "*.bin" --dir "web/firmware/$tag" --clobber 2>/dev/null || echo "Failed to download assets for $tag, skipping"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - uses: actions/deploy-pages@v4
        id: deploy
