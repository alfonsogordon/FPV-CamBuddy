name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Validate FPV CamBuddy]
    types: [completed]
    branches: [integration/v1.0.3-rc2]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - uses: actions/checkout@v4
        with:
          ref: integration/v1.0.3-rc2
          path: devsrc
      - name: Generate main site
        working-directory: stable
        run: python3 tools/build_fps_site.py
      - name: Stage development configurator
        run: |
          mkdir -p stable/web/dev
          cp devsrc/web/config.html stable/web/dev/config.html
          cp devsrc/web/*.js stable/web/dev/
          cp devsrc/web/*.css stable/web/dev/
          cp devsrc/web/flash.html stable/web/dev/unused-original-flash.html
          rm stable/web/dev/unused-original-flash.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('stable/web/dev/config.html')
          s=p.read_text()
          s=s.replace('</body>', '<div style="position:fixed;bottom:0;left:0;right:0;padding:6px;background:#452d05;color:#fff;text-align:center;z-index:99999;font:700 12px system-ui">DEVELOPMENT CONFIGURATOR — experimental firmware</div></body>')
          p.write_text(s)
          PY
      - name: Download stable release binaries
        working-directory: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/firmware
          gh release list --repo "${{ github.repository }}" --limit 40 --json tagName,isPrerelease,isDraft --jq '.[] | select(.isPrerelease == false and .isDraft == false) | .tagName' | while read -r tag; do
            if echo "$tag" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
              mkdir -p "web/firmware/$tag"
              gh release download "$tag" --repo "${{ github.repository }}" --pattern '*.bin' --dir "web/firmware/$tag" --clobber
            fi
          done
      - name: Stage validated development firmware versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('stable/web/dev/firmware').mkdir(parents=True,exist_ok=True)
          PY
          for branch in integration/v1.0.3-rc2 v1.0.3-rc1; do
            if [ "$branch" = integration/v1.0.3-rc2 ]; then version=rc2; else version=rc1; fi
            run_id=$(gh run list --repo "${{ github.repository }}" --branch "$branch" --workflow "Validate FPV CamBuddy" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -z "$run_id" ]; then echo "No successful build for $branch"; continue; fi
            mkdir -p "/tmp/dev-$version" "stable/web/dev/firmware/$version"
            gh run download "$run_id" --repo "${{ github.repository }}" --dir "/tmp/dev-$version"
            for board in esp32c3 esp32; do
              src="/tmp/dev-$version/freeclinker-stage3-$board"
              test -f "$src/firmware.bin" || { echo "Missing $board firmware for $branch"; exit 1; }
              if [ "$board" = esp32c3 ]; then target=esp32c3supermini; else target=esp32dev; fi
              for part in bootloader partitions firmware; do
                cp "$src/$part.bin" "stable/web/dev/firmware/$version/$part-$target.bin"
              done
            done
            sha=$(gh run view "$run_id" --repo "${{ github.repository }}" --json headSha --jq .headSha)
            printf '%s|%s|%s\n' "$version" "$sha" "$run_id" >> /tmp/dev-versions.txt
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/dev-versions.txt')
          entries=[]
          if p.exists():
              for line in p.read_text().splitlines():
                  version,sha,run_id=line.split('|')
                  entries.append(dict(tag_name=version,display_name='v1.0.3 '+version.upper()+' — validated build',sha=sha,published_at='GitHub Actions run '+run_id,html_url='https://github.com/alfonsogordon/FPV-CamBuddy/actions/runs/'+run_id,is_candidate=True))
          if not entries: raise SystemExit('No validated development builds found')
          Path('stable/web/dev/firmware/versions.json').write_text(json.dumps(entries))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stable/web
      - id: deployment
        uses: actions/deploy-pages@v4
