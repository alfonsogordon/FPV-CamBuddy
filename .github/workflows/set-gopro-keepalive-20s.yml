name: Set GoPro keep-alive 20s
on:
  push:
    paths: ['.github/workflows/set-gopro-keepalive-20s.yml']
permissions:
  contents: write
  actions: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set connected-only GoPro keep-alive to 20 seconds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/gopro_camera.cpp')
          s=p.read_text()
          old='if (now - _lastKeepAliveMs >= 3000) {'
          new='if (now - _lastKeepAliveMs >= 20000) {'
          if old not in s:
              raise SystemExit('Expected 3-second keep-alive block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/set-gopro-keepalive-20s.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/gopro_camera.cpp .github/workflows/set-gopro-keepalive-20s.yml
          git commit -m "Use 20-second connected GoPro keep-alive"
          git push
