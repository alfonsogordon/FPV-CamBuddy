name: Apply FPSteVe feature bundle

on:
  push:
    paths:
      - '.fps_patch/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested FPSteVe feature files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .fps_patch/READY ]; then
            echo "Patch already applied; nothing to do."
            exit 0
          fi
          cat .fps_patch/part_* > /tmp/fps-features.b64
          base64 -d /tmp/fps-features.b64 > /tmp/fps-features.tar.xz
          tar -xJf /tmp/fps-features.tar.xz -C .
          test "$(git hash-object src/config_manager.cpp)" = "b29b67f0fdd4603b76ea7c1c31d86e5ad29296e9"
          test "$(git hash-object src/msp_serial.cpp)" = "343c287412bf909a426a8aa5f011117ad922542b"
          test "$(git hash-object web/config.html)" = "0b0fb3e8838e3b7acc1dee2f662826e377e2e3b1"
          rm -rf .fps_patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Port tested FPSteVe warnings and pre-arm reminder"
          git push
