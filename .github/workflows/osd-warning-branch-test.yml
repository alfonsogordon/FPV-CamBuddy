name: Build OSD warning branch
on:
  push:
    branches: [fps-osd-warnings-custom-text]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore clean firmware baseline
        run: git checkout main -- src/config_manager.h src/config_manager.cpp src/msp_serial.h src/msp_serial.cpp src/main.cpp
      - name: Prepare finalized OSD firmware sources
        run: python tools/finalize_osd_sources.py
      - name: Validate configurator
        run: python tools/build_fps_pages.py
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build both boards
        run: pio run
